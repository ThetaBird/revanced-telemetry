name: Release patch bundle

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "version = \"$version\"" build.gradle.kts
          grep -Fq "/v$version/music-telemetry-$version.rvp" patches.json
          grep -Fq "\"version\": \"$version\"" patches.json
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - name: Build and test patch bundle
        run: ./scripts/build.sh
      - name: Test packaging helpers
        run: python3 -m unittest discover -s tests/scripts -v
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="patches/build/libs/music-telemetry-${GITHUB_REF_NAME#v}.rvp"
          sha256sum "$artifact" > "$artifact.sha256"
          gh release create "$GITHUB_REF_NAME" "$artifact" "$artifact.sha256" \
            --title "Music telemetry ${GITHUB_REF_NAME#v}" --generate-notes
